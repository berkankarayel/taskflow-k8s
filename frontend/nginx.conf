# Copied to /etc/nginx/conf.d/default.conf in the image.
# Serves the built React app. /api is routed to the backend by the Ingress, not here.

server {
    # Non-root containers cannot bind to ports below 1024.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite puts content-hashed files under /assets: a new build gets new names,
    # so these can be cached for a long time.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Probe endpoint: answers without touching the backend.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # If an /api request reaches the frontend, the routing is wrong. Fail clearly
    # instead of answering with index.html.
    location /api/ {
        default_type application/json;
        return 404 '{"detail": "The frontend does not serve /api; route it to the backend"}';
    }

    # SPA fallback: /tasks/new is not a file on disk. Return index.html and let
    # React Router pick the page. no-cache so a new deploy is picked up at once.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
